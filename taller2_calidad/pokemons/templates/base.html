<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}Pokedex{% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            background-image:
                radial-gradient(1px 1px at 20px 30px, #fff, transparent),
                radial-gradient(1px 1px at 40px 70px, #fff, transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, #fff, transparent),
                radial-gradient(1px 1px at 160px 120px, #fff, transparent),
                radial-gradient(1px 1px at 200px 50px, #fff, transparent),
                radial-gradient(1px 1px at 250px 100px, #fff, transparent),
                radial-gradient(1px 1px at 300px 30px, #fff, transparent),
                radial-gradient(1px 1px at 350px 150px, #fff, transparent),
                radial-gradient(1px 1px at 400px 90px, #fff, transparent),
                radial-gradient(1px 1px at 450px 180px, #fff, transparent),
                radial-gradient(1px 1px at 500px 60px, #fff, transparent);
            background-repeat: repeat;
            background-size: 550px 200px;
            animation: stars 120s linear infinite;
            opacity: 0.8;
        }

        body::after {
            background-image:
                radial-gradient(1.5px 1.5px at 10px 40px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 60px 90px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 120px 20px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 180px 130px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 240px 70px, #fff, transparent),
                radial-gradient(1.5px 1.5px at 300px 160px, #fff, transparent);
            background-repeat: repeat;
            background-size: 400px 200px;
            animation: stars 90s linear infinite reverse;
            opacity: 0.6;
        }

        @keyframes stars {
            from { background-position: 0 0; }
            to   { background-position: 550px 200px; }
        }

        main, nav, footer {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-white fs-4" href="{% url 'pokemon_list' %}">
                Poke<span>dex</span>
            </a>
        </div>
    </nav>

    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="py-3 text-center mt-5">
        <p class="mb-0 small">Pokedex &mdash; Autores: Gerson Teran, Roy Armijos, Anthony Ruiz</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
