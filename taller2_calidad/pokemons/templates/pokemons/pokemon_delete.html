{% extends "base.html" %}

{% block title %}Eliminar — {{ pokemon.name|capfirst }}{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">

        <div class="poke-delete-card text-center">

            <div class="poke-delete-header">
                <h3 class="mb-0 fw-bold text-white">
                    <i class="bi bi-exclamation-triangle-fill"></i> Eliminar Pokémon
                </h3>
            </div>

            <div class="card-body p-4">

                {% if pokemon.image %}
                <div class="poke-delete-img-box mb-3">
                    <div class="poke-img-glow-red"></div>
                    <img src="{{ pokemon.image }}"
                         alt="{{ pokemon.name }}"
                         class="poke-delete-img">
                </div>
                {% endif %}

                <div class="alert-delete">
                    <h5 class="mb-1">
                        ¿Eliminar a <strong class="text-capitalize">{{ pokemon.name }}</strong>?
                    </h5>
                    <p class="mb-0 small">Esta acción no se puede deshacer.</p>
                </div>

                <div class="d-flex gap-3 justify-content-center mt-4 flex-wrap">
                    <form method="POST">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-delete fw-bold px-4">
                            <i class="bi bi-trash-fill"></i> Sí, eliminar
                        </button>
                    </form>
                    <a class="btn btn-cancel-del fw-bold px-4"
                       href="{% url 'pokemon_detail' pokemon.id %}">
                        <i class="bi bi-arrow-left"></i> Cancelar
                    </a>
                </div>

            </div>
        </div>

    </div>
</div>

<style>
    .poke-delete-card {
        background: linear-gradient(145deg, #2a1a2a 0%, #1a0f16 100%);
        border: 2px solid rgba(255, 100, 100, 0.35);
        border-radius: 1.2rem;
        overflow: hidden;
        box-shadow: 0 0 30px rgba(255, 60, 60, 0.2);
        color: #e8f3ff;
    }
    .poke-delete-header {
        background: linear-gradient(135deg, #6b0a0a 0%, #a01414 50%, #cc0000 100%);
        padding: 20px;
        border-bottom: 2px solid rgba(255, 100, 100, 0.5);
    }

    .poke-delete-img-box {
        position: relative;
        display: inline-block;
        padding: 20px;
        border-radius: 1rem;
        background: radial-gradient(circle at center, #3a1a2a 0%, #1a0f16 100%);
        border: 1px solid rgba(255, 100, 100, 0.3);
    }
    .poke-img-glow-red {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 80, 80, 0.4) 0%, transparent 70%);
        animation: pulseRed 2s ease-in-out infinite;
        pointer-events: none;
    }
    @keyframes pulseRed {
        0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
        50%      { opacity: 0.9; transform: translate(-50%, -50%) scale(1.2); }
    }
    .poke-delete-img {
        height: 130px;
        width: auto;
        image-rendering: pixelated;
        position: relative;
        z-index: 2;
        filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.6));
    }

    .alert-delete {
        background: rgba(255, 60, 60, 0.12);
        border: 1px solid rgba(255, 100, 100, 0.4);
        border-radius: 12px;
        padding: 18px;
        color: #ffcccc;
    }
    .alert-delete strong { color: #fff; }

    .btn-delete {
        background: linear-gradient(135deg, #cc0000 0%, #ff3333 100%);
        border: none;
        color: #fff;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(255, 60, 60, 0.5);
    }
    .btn-delete:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 25px rgba(255, 60, 60, 0.9);
        color: #fff;
    }
    .btn-cancel-del {
        background: transparent;
        border: 2px solid rgba(126, 200, 255, 0.5);
        color: #7ec8ff;
        transition: all 0.3s ease;
    }
    .btn-cancel-del:hover {
        background: rgba(126, 200, 255, 0.15);
        border-color: #7ec8ff;
        color: #fff;
    }
</style>

{% endblock %}
